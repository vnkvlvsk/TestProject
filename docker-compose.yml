services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: limit_service
      POSTGRES_USER: limit_service
      POSTGRES_PASSWORD: limit_service
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./docker/init-readonly-user.sql:/docker-entrypoint-initdb.d/init-readonly-user.sql
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
