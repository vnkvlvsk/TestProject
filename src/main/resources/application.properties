spring.application.name=limit-service
server.port=${SERVER_PORT:8080}

spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/limit_service}
spring.datasource.username=${DB_USERNAME:limit_service}
spring.datasource.password=${DB_PASSWORD:limit_service}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health,info,metrics

app.twelvedata.base-url=${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
app.twelvedata.api-key=${TWELVEDATA_API_KEY:demo}
app.twelvedata.connect-timeout=2s
app.twelvedata.read-timeout=5s
app.twelvedata.max-attempts=3
app.twelvedata.retry-delay=500ms

app.limits.zone=UTC
app.limits.default-limit-sum=1000.00
app.limits.pending-retry-delay=60s
